name: Build portable pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version (for example v0.0.1)"
        required: true
        default: "v0.0.1"
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    if: >-
      github.event_name != 'push' ||
      (github.ref_type == 'branch' && github.event.head_commit.message == 'chore(release): rebuild v0.0.1') ||
      (github.ref_type == 'tag' && github.event.created == true)
    runs-on: windows-latest
    steps:
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $version = "v0.0.1"
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Version must use vMAJOR.MINOR.PATCH format, for example v0.0.1" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build full RGB Studio
        shell: cmd
        run: msbuild VeigarConfigurator.sln /m /p:Configuration=Release /verbosity:minimal

      - name: Assemble portable Windows x64 archive
        shell: pwsh
        run: |
          $source = "src/VeigarConfigurator.App/bin/Release"
          $package = "Veigar-K643-Configurator-$env:RELEASE_VERSION-win-x64"
          $files = @(
            "VeigarConfigurator.exe",
            "VeigarConfigurator.Core.dll",
            "VeigarConfigurator.Devices.Redragon.dll",
            "VeigarConfigurator.Windows.dll"
          )

          New-Item -ItemType Directory -Force -Path $package | Out-Null

          foreach ($file in $files) {
            $path = Join-Path $source $file
            if (-not (Test-Path $path)) {
              throw "Required RGB Studio build output is missing: $path"
            }
            Copy-Item $path -Destination $package
          }

          $config = "src/VeigarConfigurator.App/App.config"
          if (-not (Test-Path $config)) { throw "Application config is missing: $config" }
          Copy-Item $config (Join-Path $package "VeigarConfigurator.exe.config")

          Copy-Item "Start-VeigarConfigurator.cmd" -Destination $package

          $archive = "$package.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -CompressionLevel Optimal
          Get-FileHash $archive -Algorithm SHA256

      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_VERSION
          $archive = "Veigar-K643-Configurator-$tag-win-x64.zip"
          $notes = "Windows x64 portable full RGB Studio. Requires Microsoft .NET Framework 4.8 or newer. The application opens a filtered diagnostics console at startup. Source code: src/VeigarConfigurator.App."

          $null = gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            git push --force origin "HEAD:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update tag $tag to the rebuilt source." }

            gh release upload $tag $archive --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to replace the portable ZIP for $tag." }

            gh release edit $tag --repo "${{ github.repository }}" --title $tag --prerelease --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release metadata for $tag." }
          } else {
            gh release create $tag $archive --repo "${{ github.repository }}" --target main --title $tag --prerelease --notes $notes
          }

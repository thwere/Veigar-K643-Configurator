name: Build portable pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version (for example v0.0.1)"
        required: true
        default: "v0.0.1"
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    if: >-
      github.event_name != 'push' ||
      (github.ref_type == 'branch' && github.event.head_commit.message == 'chore(release): rebuild v0.0.1') ||
      (github.ref_type == 'tag' && github.event.created == true)
    runs-on: windows-latest
    steps:
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $version = "v0.0.1"
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Version must use vMAJOR.MINOR.PATCH format, for example v0.0.1" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/VeigarK643.Shell/VeigarK643.Shell.csproj --runtime win-x64 --source https://api.nuget.org/v3/index.json --verbosity minimal -p:NuGetAudit=false

      - name: Publish portable Windows x64
        run: dotnet publish src/VeigarK643.Shell/VeigarK643.Shell.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output publish/win-x64

      - name: Assemble flat portable archive
        shell: pwsh
        run: |
          $package = "Veigar-K643-Configurator-$env:RELEASE_VERSION-win-x64"
          New-Item -ItemType Directory -Force -Path "$package" | Out-Null
          Copy-Item "publish/win-x64/*" "$package/" -Recurse -Force
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip" -CompressionLevel Optimal

      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_VERSION
          $archive = "Veigar-K643-Configurator-$tag-win-x64.zip"

          $null = gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Keep the existing version tag attached to the exact source used for this rebuild.
            git push --force origin "HEAD:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update tag $tag to the rebuilt source." }

            gh release upload $tag $archive --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to replace the portable ZIP for $tag." }

            gh release edit $tag --repo "${{ github.repository }}" --title $tag --prerelease --notes "Windows x64 portable pre-release. The ZIP contains only portable application files. Source code is maintained in the repository under src/VeigarK643.Shell."
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release metadata for $tag." }
          } else {
            gh release create $tag $archive --repo "${{ github.repository }}" --target main --title $tag --prerelease --notes "Windows x64 portable pre-release. The ZIP contains only portable application files. Source code is maintained in the repository under src/VeigarK643.Shell."
          }

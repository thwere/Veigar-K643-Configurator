name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build WPF applications
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore main shell with NuGet security audit
        run: dotnet restore src/VeigarK643.Shell/VeigarK643.Shell.csproj --verbosity minimal -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build main shell
        run: dotnet build src/VeigarK643.Shell/VeigarK643.Shell.csproj --configuration Release --no-restore

      - name: Publish layout editor (portable x64)
        run: dotnet publish tools/VeigarK643.LayoutEditor/VeigarK643.LayoutEditor.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output publish/layout-editor

      - name: Upload layout editor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Veigar-K643-Layout-Editor-win-x64
          path: publish/layout-editor/
          if-no-files-found: error
          retention-days: 30

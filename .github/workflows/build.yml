name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build WPF applications
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build main shell
        run: dotnet build src/VeigarK643.Shell/VeigarK643.Shell.csproj --configuration Release

      - name: Publish layout editor (portable x64)
        run: dotnet publish tools/VeigarK643.LayoutEditor/VeigarK643.LayoutEditor.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output publish/layout-editor

      - name: Upload layout editor
        uses: actions/upload-artifact@v4
        with:
          name: Veigar-K643-Layout-Editor-win-x64
          path: publish/layout-editor/
          if-no-files-found: error
          retention-days: 30

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build WPF solution
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: cmd
        run: msbuild VeigarConfigurator.sln /m /p:Configuration=Release /verbosity:minimal

      - name: Upload portable prototype
        uses: actions/upload-artifact@v4
        with:
          name: VeigarConfigurator-prototype
          path: src/VeigarConfigurator.App/bin/Release/
          if-no-files-found: error
          retention-days: 7

name: Publish pre-release

on:
  create:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish pre-release
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/')
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build Release
        shell: cmd
        run: msbuild VeigarConfigurator.sln /m /p:Configuration=Release /verbosity:minimal
      - name: Package portable Windows build
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.Substring("release/".Length).Replace("-rebuild", "")
          $archive = "VeigarConfigurator-$tag-win-x64.zip"
          $source = "src/VeigarConfigurator.App/bin/Release"
          $stage = "dist/VeigarConfigurator-$tag-win-x64"
          $files = @(
            "VeigarConfigurator.exe",
            "VeigarConfigurator.Core.dll",
            "VeigarConfigurator.Devices.Redragon.dll",
            "VeigarConfigurator.Windows.dll"
          )
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($file in $files) {
            $path = Join-Path $source $file
            if (-not (Test-Path $path)) { throw "Required build output is missing: $path" }
            Copy-Item $path -Destination $stage
          }
          Copy-Item "src/VeigarConfigurator.App/App.config" -Destination (Join-Path $stage "VeigarConfigurator.exe.config")
          Copy-Item "Start-VeigarConfigurator.cmd" -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          Get-FileHash $archive -Algorithm SHA256
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Remove superseded alpha releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          foreach ($oldTag in @("v0.3.0-alpha", "v0.3.1-alpha")) {
            gh release view $oldTag --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release delete $oldTag --repo "${{ github.repository }}" --yes --cleanup-tag
            } else {
              git ls-remote --exit-code --tags origin "refs/tags/$oldTag" *> $null
              if ($LASTEXITCODE -eq 0) {
                git push origin --delete "refs/tags/$oldTag"
              }
            }
          }
      - name: Create GitHub pre-release and attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path $notes)) { throw "Release notes file not found: $notes" }
          gh release create "$env:RELEASE_TAG" "VeigarConfigurator-$env:RELEASE_TAG-win-x64.zip" --repo "${{ github.repository }}" --target "main" --title "Veigar K643 Configurator $env:RELEASE_TAG" --notes-file $notes --prerelease
